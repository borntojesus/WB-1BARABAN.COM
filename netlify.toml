# Full static site (nitro preset netlify_static, `nuxi generate`).
# Fleet rule: no Netlify remote builds. Build locally, then deploy the prebuilt
# folder with `netlify deploy --no-build` (see DEPLOY.md). The [build] block is
# kept only so `netlify deploy` knows the publish dir.
[build]
  base = "web"
  command = "pnpm run generate"
  # `base` scopes the build command, but `publish` is resolved from the repo root.
  publish = "web/dist"

[build.environment]
  NODE_VERSION = "22"

# Netlify's Pretty URLs would 301 /about -> /about/, but the sitemap and the
# canonical tags Nuxt emits are slash-less. Keep URLs exactly as prerendered.
[build.processing.html]
  pretty_urls = false

# _headers and _redirects are generated into web/dist by the netlify_static
# preset (cache headers, X-Robots-Tag noindex on /ask, 404 fallback).
