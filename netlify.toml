[build]
  base = "web"
  command = "pnpm run build"
  # `base` scopes the build command, but `publish` is resolved from the repo root.
  publish = "web/dist"

[build.environment]
  NODE_VERSION = "22"

# Netlify's Pretty URLs would 301 /about -> /about/, but the sitemap and the
# canonical tags Nuxt emits are slash-less. Keep URLs exactly as prerendered.
[build.processing.html]
  pretty_urls = false
  # pnpm version comes from the `packageManager` field in web/package.json (corepack)

# Nuxt's `netlify` nitro preset emits the SSR handler into
# web/.netlify/functions-internal/server, which Netlify picks up automatically.
# Headers and redirects are generated by the preset — do not duplicate them here.
